[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klarity"
version = "0.1.0"
description = "Uncertainty estimation for open-source generative models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "scipy>=1.0.0",
    "pydantic>=2.0.0",
    "together>=1.0.0",
    "matplotlib>=3.5.0",
    "ninja>=1.10.0",
    "python-dotenv>=1.0.0",
    "setuptools>=65.0.0",
    # Use torch 2.5.1 for Python < 3.13, and 2.6.0 for Python >= 3.13
    "torch==2.5.1 ; python_version < '3.13'",
    "torch>=2.6.0 ; python_version >= '3.13'",
    "sentence-transformers>=2.2.0",
    "accelerate>=0.20.0",
]

[project.optional-dependencies]
cuda = [
    "cuda-python>=12.0.0",
    "nvidia-cuda-nvrtc-cu12>=12.0.0",
]
# vllm requires torch==2.5.1, which is only compatible with Python < 3.13
vllm = [
    "vllm>=0.7.0 ; python_version < '3.13'",
]
xgrammar = [
    "xgrammar>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0"
]

[tool.uv.sources]
# For Python < 3.13, use torch 2.5.1 with CUDA on Linux
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and python_version < '3.13'" },
    { index = "pytorch-cu124-py3.13", marker = "sys_platform == 'linux' and python_version >= '3.13'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' and python_version < '3.13'" },
    { index = "pytorch-cu124-py3.13", marker = "sys_platform == 'linux' and python_version >= '3.13'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124-py3.13"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.urls]
Homepage = "https://github.com/klara-research/klarity"
Issues = "https://github.com/klara-research/klarity/issues"
Repository = "https://github.com/klara-research/klarity.git"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["klarity", "klarity.core"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-s"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
